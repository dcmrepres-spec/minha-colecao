<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Coleção F1 1:43</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-hover: #2a2a2a;
            --accent-color: #e10600;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --success-color: #00b050;
        }
        body {
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 60px;
        }
        .header {
            text-align: center;
            padding: 20px 0;
        }
        .header h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 1.8em;
            letter-spacing: 1px;
        }
        .header p {
            margin: 5px 0 0 0;
            color: var(--text-secondary);
            font-size: 0.9em;
        }
        .search-container {
            max-width: 600px;
            margin: 0 auto 20px auto;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: var(--card-bg);
            color: white;
            box-sizing: border-box;
            font-size: 1em;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
            border: 2px solid transparent;
            position: relative;
        }
        .card:hover {
            transform: translateY(-3px);
            background-color: var(--card-hover);
        }
        .card.owned {
            border-color: var(--success-color);
        }
        .card.owned::after {
            content: "✓";
            position: absolute;
            top: 5px;
            right: 8px;
            color: var(--success-color);
            font-weight: bold;
            font-size: 0.9em;
        }
        .badge-year {
            background-color: var(--accent-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85em;
        }
        .card-pilot {
            margin: 8px 0 0 0;
            font-size: 0.85em;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            max-width: 450px;
            width: 85%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }
        .close {
            position: absolute; top: 10px; right: 15px;
            font-size: 28px; cursor: pointer; color: #888;
        }
        .info-row {
            margin: 10px 0;
            font-size: 0.95em;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
        }
        .info-row strong { color: var(--text-secondary); }
        .img-box {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .img-box div {
            flex: 1;
            background: #252525;
            padding: 5px;
            border-radius: 6px;
            text-align: center;
        }
        .img-box span {
            display: block;
            font-size: 0.75em;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .modal img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            border-radius: 4px;
            background-color: #1a1a1a;
        }
        .history-text {
            font-size: 0.88em;
            line-height: 1.4;
            color: #dddddd;
            margin-top: 15px;
            background: #252525;
            padding: 10px;
            border-radius: 6px;
        }
        .btn-toggle {
            background-color: #333; color: white; border: none;
            padding: 12px; width: 100%; border-radius: 6px;
            font-weight: bold; cursor: pointer; margin-top: 15px;
            font-size: 1em;
            transition: background 0.2s;
        }
        .btn-toggle.owned {
            background-color: var(--success-color);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏎️ Miniaturas F1 1:43</h1>
        <p>Catálogo de Campeões Mundiais & Inventário</p>
    </div>

    <div class="search-container">

    <div class="grid" id="app-grid"></div>

            <div class="history-text" id="modal-history"></div>
            <button class="btn-toggle" id="btn-own" onclick="toggleOwnership()">Marcar como Adquirido</button>
        </div>
    </div>

        // LÓGICA DE ATIVAÇÃO DO APLICATIVO
        function renderGrid(dados = dadosColecao) {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = '';
            dados.forEach(item => {
                const isOwned = localStorage.getItem('f1_143_' + item.ano) === 'true';
                const card = document.createElement('div');
                card.className = `card ${isOwned ? 'owned' : ''}`;
                card.onclick = () => openModal(item);
                card.innerHTML = `
                    <span class="badge-year">${item.ano}</span>
                    <p class="card-pilot">${item.piloto}</p>
                `;
                grid.appendChild(card);
            });
        }

        function filtrarCards() {
            const termo = document.getElementById('search-input').value.toLowerCase();
            const filtrados = dadosColecao.filter(item => 
                item.ano.toString().includes(termo) ||
                item.piloto.toLowerCase().includes(termo) ||
                item.carro.toLowerCase().includes(termo) ||
                item.circuito.toLowerCase().includes(termo)
            );
            renderGrid(filtrados);
        }

        let itemSelecionado = null;

        function openModal(item) {
            itemSelecionado = item;
            document.getElementById('modal-title').innerText = "Temporada " + item.ano;
            document.getElementById('modal-pilot').innerText = item.piloto;
            document.getElementById('modal-car').innerText = item.carro;
            document.getElementById('modal-number').innerText = "#" + item.numero;
            document.getElementById('modal-track').innerText = item.circuito;
            document.getElementById('modal-history').innerText = item.history ? item.history : item.historia;
            
            document.getElementById('img-car').src = item.imgCarro ? item.imgCarro : "https://placeholders.dev";
            document.getElementById('img-track').src = item.imgCircuito ? item.imgCircuito : "https://placeholders.dev";

            const isOwned = localStorage.getItem('f1_143_' + item.ano) === 'true';
            const btn = document.getElementById('btn-own');
            if(isOwned) {
                btn.innerText = "✓ Na Minha Estante";
                btn.classList.add('owned');
            } else {
                btn.innerText = "Marcar como Adquirido";
                btn.classList.remove('owned');
            }
            document.getElementById('detail-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detail-modal').style.display = 'none';
        }

        function toggleOwnership() {
            if(!itemSelecionado) return;
            const key = 'f1_143_' + itemSelecionado.ano;
            const current = localStorage.getItem(key) === 'true';
            localStorage.setItem(key, !current);
            openModal(itemSelecionado);
            filtrarCards();
        }

        window.onload = () => {
            renderGrid();
        };
    </script>
